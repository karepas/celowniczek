name: Approve community crosshair

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: community-crosshair-list
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'community-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Validate and publish approved crosshair
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const issueResponse = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const issueBody = issueResponse.data.body || '';
              const jsonBlock = issueBody.match(/```json\s*([\s\S]*?)```/i);
              if (!jsonBlock) {
                throw new Error('The issue must contain a JSON code block.');
              }

              const submitted = JSON.parse(jsonBlock[1]);
              const value = (lower, upper) => submitted[lower] ?? submitted[upper];
              const title = value('title', 'Title');
              const author = value('author', 'Author');
              const size = value('size', 'Size');
              const thickness = value('thickness', 'Thickness');
              const gap = value('gap', 'Gap');
              const dotRadius = value('dotRadius', 'DotRadius');
              const colorHex = value('colorHex', 'ColorHex');
              const enableOutline = value('enableOutline', 'EnableOutline');
              const style = value('style', 'Style');
              const validInteger = (number, min, max) => Number.isInteger(number) && number >= min && number <= max;

              if (typeof title !== 'string' || title.trim().length < 1 || title.trim().length > 64
                  || typeof author !== 'string' || author.trim().length < 1 || author.trim().length > 40
                  || !validInteger(size, 2, 50)
                  || !validInteger(thickness, 1, 10)
                  || !validInteger(gap, 0, 30)
                  || !validInteger(dotRadius, 0, 10)
                  || typeof colorHex !== 'string' || !/^#[0-9a-fA-F]{6}$/.test(colorHex)
                  || typeof enableOutline !== 'boolean'
                  || !['Cross', 'DotOnly', 'Circle'].includes(style)) {
                throw new Error('The submitted crosshair contains invalid values.');
              }

              const crosshair = {
                Title: title.trim(),
                Author: author.trim(),
                Size: size,
                Thickness: thickness,
                Gap: gap,
                DotRadius: dotRadius,
                ColorHex: colorHex.toUpperCase(),
                EnableOutline: enableOutline,
                Style: style
              };

              const path = 'community/crosshairs.json';
              const fileResponse = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (Array.isArray(fileResponse.data) || !fileResponse.data.content) {
                throw new Error('The community crosshair JSON file could not be read.');
              }

              const currentEntries = JSON.parse(Buffer.from(fileResponse.data.content, 'base64').toString('utf8'));
              if (!Array.isArray(currentEntries)) {
                throw new Error('The community crosshair JSON file is not an array.');
              }

              const duplicate = currentEntries.some(entry =>
                String(entry.Title || '').trim().toLowerCase() === crosshair.Title.toLowerCase()
                && String(entry.Author || '').trim().toLowerCase() === crosshair.Author.toLowerCase());
              if (duplicate) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: 'This author has already published a crosshair with this title.'
                });
                return;
              }

              currentEntries.push(crosshair);
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                branch: 'main',
                message: `Add approved community crosshair: ${crosshair.Title}`,
                content: Buffer.from(`${JSON.stringify(currentEntries, null, 2)}\n`).toString('base64'),
                sha: fileResponse.data.sha
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: 'Approved and added to the in-app community crosshair list.'
              });
              await github.rest.issues.update({ owner, repo, issue_number: issueNumber, state: 'closed' });
            } catch (error) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `Could not publish this crosshair: ${error.message}`
              });
              throw error;
            }
